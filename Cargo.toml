[package]
name = "alfred-2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
dotenvy = "0.15.7"
json = "0.12.4"
poise = "0.6.1"
rand = "0.10.0"
regex = "1.10.4"
reqwest = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.9.0", features = ["derive", "macros", "runtime-tokio", "sqlite"] }
time = "0.3.47"
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread"] }
typst = "0.15"
typst-kit = { version = "0.15", features = [
    "embedded-fonts",
] }
typst-layout = "0.15"
typst-render = "0.15"
